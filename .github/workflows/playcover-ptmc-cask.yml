name: Test PlayCover PTMC cask

on:
  push:
    branches: [main]
    paths:
      - Casks/playcover-ptmc.rb
      - .github/workflows/playcover-ptmc-cask.yml
  workflow_dispatch:

jobs:
  install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install from public tap
        run: |
          brew untap EmilyTsum/tap 2>/dev/null || true
          brew install --cask EmilyTsum/tap/playcover-ptmc
      - name: Validate installed app
        run: |
          test -d /Applications/PlayCover.app
          echo "Installed app: $(ls -ld /Applications/PlayCover.app)"
          echo "Resolved app: $(python3 -c 'import os; print(os.path.realpath("/Applications/PlayCover.app"))')"
          test -f /Applications/PlayCover.app/Contents/MacOS/PlayCover
          test -f /Applications/PlayCover.app/Contents/Frameworks/PlayTools.framework/PlayTools
          HOST=/Applications/PlayCover.app/Contents/MacOS/PlayCover
          strings "$HOST" | grep -F 'PTMC recording start requested via'
          strings "$HOST" | grep -F 'PTMC global hotkey registration incomplete'
          strings "$HOST" | grep -F 'PTMC recording stop requested via'
          strings /Applications/PlayCover.app/Contents/Frameworks/PlayTools.framework/PlayTools | grep -F 'io.playcover.ptmc.start'
          strings /Applications/PlayCover.app/Contents/Frameworks/PlayTools.framework/PlayTools | grep -F 'PTMC_OUTPUT_DIR'
          strings /Applications/PlayCover.app/Contents/Frameworks/PlayTools.framework/PlayTools | grep -F 'prores422lt'
          strings /Applications/PlayCover.app/Contents/Frameworks/PlayTools.framework/PlayTools | grep -F 'frame hooks are dormant until Start'
          codesign --verify --deep --strict /Applications/PlayCover.app
      - name: Runtime startup smoke test
        run: |
          set -euo pipefail
          sw_vers
          /Applications/PlayCover.app/Contents/MacOS/PlayCover >/tmp/playcover-stdout.log 2>&1 &
          pid="$!"
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            cat /tmp/playcover-stdout.log
            exit 1
          fi
          ps -o pid,ppid,state,%cpu,%mem,etime,command -p "$pid"
          /usr/bin/sample "$pid" 1 1 -file /tmp/playcover-sample.txt >/dev/null 2>&1 || true
          echo '--- main-thread sample ---'
          awk '/Call graph:/{show=1} show{print} /Binary Images:/{exit}' /tmp/playcover-sample.txt | head -n 180 || true
          kill "$pid" || true
